spring:
  application:
    name: gymflow-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gymflow_db}
    username: ${SPRING_DATASOURCE_USERNAME:gymflow}
    password: ${SPRING_DATASOURCE_PASSWORD:gymflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    org.flywaydb: info

api:
  security:
    token:
      secret: ${JWT_SECRET:dev-secret-change-me}
      expiration-hours: ${JWT_EXPIRATION_HOURS:2}

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}