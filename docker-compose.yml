services:
  postgres:
    image: postgres:16
    container_name: gymflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: gymflow_db
      POSTGRES_USER: gymflow
      POSTGRES_PASSWORD: gymflow

    ports:
      - "5432:5432"

    volumes:
      - gymflow_postgres_data:/var/lib/postgresql/data

volumes:
  gymflow_postgres_data: